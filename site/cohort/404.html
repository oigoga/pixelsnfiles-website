<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — PixelsnFiles Cohort</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/cohort/favicon-32.png" sizes="32x32" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Poppins:wght@500;600;700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{--navy:#16324F;--butter:#FBF3DC;--honey:#FFB81C;--honey-soft:#FFE9AF;--cream:#FFFDF4}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--butter);color:var(--navy);font-family:'Poppins',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
}
.card{
  background:var(--cream);border:2px solid var(--navy);border-radius:28px;
  padding:56px 40px;max-width:460px;box-shadow:8px 8px 0 var(--honey);transform:rotate(-1deg);
}
.num{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:96px;line-height:1;color:var(--honey);-webkit-text-stroke:1.5px var(--navy)}
h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;margin:10px 0 14px}
p{font-size:15px;margin-bottom:26px;opacity:.85}
.script{font-family:'Yellowtail',cursive;font-size:22px;transform:rotate(-2deg);display:inline-block;margin-bottom:22px}
.btn{
  display:inline-block;text-decoration:none;font-weight:700;font-size:14px;color:var(--navy);
  background:var(--honey);padding:13px 28px;border-radius:999px;border:2px solid var(--navy);
  box-shadow:4px 4px 0 var(--navy);transition:transform .15s ease;
}
.btn:hover{transform:translate(-2px,-2px)}
</style>
</head>
<body>
  <div class="card">
    <div class="num">404</div>
    <h1>This page didn't make the portfolio.</h1>
    <div class="script">wrong turn ✦</div>
    <p>The page you're looking for doesn't exist — but the cohort still does.</p>
    <a class="btn" href="/cohort/">Back to the cohort</a>
  </div>
</body>
</html>
